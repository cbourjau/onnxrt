[package]
name = "onnxrt"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "onnxrt"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = [
  "cdylib",
  "rlib",   # Needed for the tests to link correctly
]


[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
flume = "0.12.0"
half = { version = "2.7.1", features = ["num-traits"] }
itertools = "0.14.0"
libm = "0.2.16"
ndarray = "0.17.2"
num = "0.4.3"
num-traits = "0.2.19"
numpy = "0.28"
onnx_protos = { version = "0.1.0", path = "../onnx_protos" }
ordered-float = "5.1.0"
protobuf = "3.7.2"
rand = "0.10.0"

[dependencies.pyo3]
version = "0.28"
# "extension-module" tells pyo3 we want to build an extension module
# (skips linking against libpython.so) "abi3-py38" tells pyo3 (and
# maturin) to build using the stable ABI with minimum Python version
# 3.8
features = ["extension-module", "abi3-py38"]

[build-dependencies]
protobuf-codegen = "3.7.2"
pyo3-build-config = "0.28"

[dev-dependencies]
approx = "0.5.1"
ndarray = { version = "0.17", features = ["approx"] }
upstream_test_data = { path = "../upstream_test_data" }
