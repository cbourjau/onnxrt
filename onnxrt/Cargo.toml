[package]
name = "onnxrt"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "onnxrt"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = [
  "cdylib",
  "rlib",   # Needed for the tests to link correctly
]


[dependencies]
anyhow = { version = "1.0.64", features = ["backtrace"] }
flume = "0.12.0"
half = { version = "2.7.1", features = ["num-traits"] }
itertools = "0.10.5"
ndarray = "0.15.6"
num = "0.4.0"
num-traits = "0.2.15"
numpy = "0.19"
onnx_protos = { version = "0.1.0", path = "../onnx_protos" }
ordered-float = "3.2.0"
protobuf = "3.1.0"
rand = "0.8.5"

[dependencies.pyo3]
version = "0.19"
# "extension-module" tells pyo3 we want to build an extension module
# (skips linking against libpython.so) "abi3-py38" tells pyo3 (and
# maturin) to build using the stable ABI with minimum Python version
# 3.8
features = ["extension-module", "abi3-py38"]

[build-dependencies]
protobuf-codegen = "3.1.0"
pyo3-build-config = "0.19"

[dev-dependencies]
approx = "0.5.1"
ndarray = { version = "0.15.6", features = ["approx-0_5"] }
upstream_test_data = { path = "../upstream_test_data" }
