name: Nix-based tests

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"  # Fail on warnings
    steps:
      - uses: actions/checkout@v3

      - name: git checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup cache
        uses: DeterminateSystems/magic-nix-cache-action@v2
      - name: Rustfmt
        run: |
          nix develop --command \
          cargo fmt --check --all
      - name: Clippy
        run: |
          nix develop --command \
          cargo clippy
      - name: Build
        run: |
          nix develop --command \
          cargo build --all
      - name: Run tests
        run: |
          nix develop --command \
          cargo test -- --nocapture
      - name: Build Python package
        run: |
          nix develop --command \
          maturin build -m ./onnxrt/Cargo.toml
      - name: Install Python package
        run: |
          nix develop --command \
          maturin develop -m ./onnxrt/Cargo.toml
      - name: Run Python tests
        run: |
          nix develop --command \
          pytest onnxrt/test_python/test.py -s
