name: Nix-based tests

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: git checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup cache
        uses: DeterminateSystems/magic-nix-cache-action@v2
      - name: Build
        run: |
          nix develop --command \
          cargo build --all
      - name: Run tests
        run: |
          RUST_BACKTRACE=1 nix develop --command \
          cargo test -- --nocapture
      - name: Build Python package
        run: |
          nix develop --command \
          maturin build -m ./onnxrt/Cargo.toml
      - name: Install Python package
        run: |
          RUST_BACKTRACE=1 nix develop --command \
          maturin develop -m ./onnxrt/Cargo.toml
      - name: Run Python tests
        if: false  # skip for now :(
        run: |
          RUST_BACKTRACE=1 nix develop --command \
          pip install onnxruntime pytest numpy && \
          python -m pytest onnxrt/test_python/test.py -s
