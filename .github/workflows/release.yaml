name: Publish to crates.io

on:
  release:
    types:
      - published

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - run: cargo publish --token ${CRATES_TOKEN} -p onnx_protos
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

      - run: cargo publish --token ${CRATES_TOKEN} -p onnxrt
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
