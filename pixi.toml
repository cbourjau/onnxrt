[workspace]
authors = ["Christian Bourjau <c.bourjau@posteo.de>"]
channels = ["conda-forge"]
name = "onnxrt"
platforms = ["osx-arm64", "linux-64", "win-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
fmt = "cargo fmt"
build = "cargo build --tests"
test = "cargo test"

[dependencies]
maturin = ">=1.12.6,<2"
rust = ">=1.94.0"
python = ">=3.14.3"
