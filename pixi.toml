[workspace]
authors = ["Christian Bourjau <c.bourjau@posteo.de>"]
channels = ["conda-forge"]
name = "onnxrt"
platforms = ["osx-arm64", "linux-64", "win-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
fmt = "cargo fmt"
build = "cargo build --tests"
test = "cargo test"
build-wheel = "maturin build --release -m onnxrt/Cargo.toml"

[dependencies]
maturin = ">=1.12.6,<2"
rust = ">=1.94.0"
python = ">=3.14.3"
rust-src = ">=1.94.0,<2"
cargo-edit = ">=0.13.9,<0.14"


[feature.lint.dependencies]
pre-commit = "*"
insert-license-header = "*"
docformatter = "*"
ruff = "*"
prettier = "*"
nbstripout = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
mypy = "*"
[feature.lint.tasks]
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run -a"

[feature.onnx-tests.dependencies]
hypothesis = ">=6.130.4"
mypy = ">=1.15.0"
ndonnx = ">=0.10.1"
numpy = ">=2.2.4"
onnx = ">=1.18.0"
onnxruntime = ">=1.20.1"
pip = "*"
pytest = ">=8.3.5"
python = ">=3.10"
ruff = ">=0.11.3"
setuptools = ">=61"
setuptools-scm = "*"
spox = ">=0.16"
[feature.onnx-tests.tasks.onnx-tests-install]
cmd = "pip install --no-deps target/wheels/onnxrt-*.whl --force && pip install --no-build-isolation --no-deps --disable-pip-version-check -e onnx-tests"
depends-on = "build-wheel"

[feature.onnx-tests.tasks.onnx-tests]
cmd = "pytest onnx-tests/tests/test_elementwise.py"
env = { "RUN_CANDIDATE" = "onnxrt._run_onnxrt" }


[environments]
lint = ["default", "lint"]
onnx-tests = { no-default-feature = true, features = ["onnx-tests"] }
