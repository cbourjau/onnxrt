[package]
name = "onnxer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "onnxer"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]


[dependencies]
anyhow = { version = "1.0.64", features = ["backtrace"] }
itertools = "0.10.5"
ndarray = "0.15.6"
num = "0.4.0"
numpy = "0.17"
ordered-float = "3.2.0"
protobuf = "3.1.0"

[dependencies.pyo3]
version = "0.17"
# "extension-module" tells pyo3 we want to build an extension module
# (skips linking against libpython.so) "abi3-py38" tells pyo3 (and
# maturin) to build using the stable ABI with minimum Python version
# 3.8
features = ["extension-module", "abi3-py38"]

[build-dependencies]
protobuf-codegen = "3.1.0"
pyo3-build-config = "0.17"

